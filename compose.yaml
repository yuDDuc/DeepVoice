name: avrt-studio
services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\", members:[{_id:0, host:\"mongo:27017\"}]}) }' | grep 1"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build: {context: ./backend, args: {INSTALL_AI: "false"}}
    env_file: .env
    environment:
      DATABASE_MODE: mongo
      DATABASE_URL: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379/0
      INFERENCE_MODE: redis
      LOCAL_MODELS_ROOT: /models/custom
      HF_CACHE_DIR: /models/cache
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes: ["./models/custom:/models/custom:ro", "hf-cache:/models/cache"]
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  worker:
    build: {context: ./backend, args: {INSTALL_AI: "false"}}
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379/0
      INFERENCE_MODE: redis
      LOCAL_MODELS_ROOT: /models/custom
      HF_CACHE_DIR: /models/cache
    volumes: ["./models/custom:/models/custom:ro", "hf-cache:/models/cache"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; assert redis.Redis.from_url(os.environ['REDIS_URL']).exists('avrt:worker:metrics')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-/ws/v1}
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  mongo-data:
  hf-cache:
