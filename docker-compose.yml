services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: mongosh --host mongo:27017 --eval "try { rs.status() } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes: ["./backend:/app"]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment: ["VITE_API_URL=http://localhost:8000"]
    depends_on: [backend]
volumes:
  mongo_data:
